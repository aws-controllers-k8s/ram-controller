ignore:
  field_paths:
      - CreateResourceShareInput.ClientToken
      - CreateResourceShareOutput.ClientToken
      - CreatePermissionInput.ClientToken
      - CreatePermissionOutput.ClientToken
  resource_names:
      - PermissionVersion
operations:
  AcceptResourceShareInvitation:
    operation_type: Create
    resource_name: ResourceShareInvitation
    output_wrapper_field_path: ResourceShareInvitation
  GetResourceShareInvitations:
    operation_type: Read_Many
    resource_name: ResourceShareInvitation
    output_wrapper_field_path: ResourceShareInvitations
  DisassociateResourceShare:
    operation_type: Delete
    resource_name: ResourceShareInvitation
resources:
  ResourceShareInvitation:
    exceptions:
      terminal_codes:
        - MalformedArnException
        - ResourceShareInvitationAlreadyAcceptedException
        - ResourceShareInvitationAlreadyRejectedException
        - ResourceShareInvitationExpiredException
      errors:
        404:
          code: ResourceShareInvitationArnNotFoundException
    fields:
      ResourceShareInvitationArn:
        is_primary_key: true
        is_immutable: true
        is_required: true
        print:
          name: INVITATION-ARN
      Status:
        is_read_only: true
        print:
          name: STATUS
      ResourceShareArn:
        is_read_only: true
        print:
          name: SHARE-ARN
    synced:
      when:
        - path: Status.Status
          in:
            - ACCEPTED
    tags:
      ignore: true
    hooks:
      sdk_read_many_post_build_request:
        template_path: hooks/resource_share_invitation/sdk_read_many_post_build_request.go.tpl
      sdk_delete_post_build_request:
        template_path: hooks/resource_share_invitation/sdk_delete_post_build_request.go.tpl
  ResourceShare:
    exceptions:
      terminal_codes:
        - MalformedArnException
      errors:
        404:
          code: UnknownResourceException
    fields:
      PermissionARNs:
        references:
          resource: Permission
          path: Status.ACKResourceMetadata.ARN
      Tags:
        from:
          operation: TagResource
          path: Tags
        compare:
          is_ignored: True
    hooks:
      delta_pre_compare:
        code: compareTags(delta, a, b)
      sdk_update_pre_build_request:
        template_path: hooks/resource_share/sdk_update_pre_build_request.go.tpl
      sdk_read_many_post_build_request:
        template_path: hooks/resource_share/sdk_find_read_many_post_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/resource_share/sdk_read_many_post_set_output.go.tpl
  Permission:
    fields:
      PolicyTemplate:
        is_document: true
    exceptions:
      terminal_codes:
        - InvalidParameterException
      errors:
        404:
          code: UnknownResourceException
    hooks:
      sdk_read_one_post_set_output:
        template_path: hooks/permission/sdk_read_one_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdatePermission
